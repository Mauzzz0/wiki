mutation ($isStudent: Boolean, $providerKey: String!, $email: String!, $name: String!, $passwordRaw: String, $groups: [Int]!, $mustChangePassword: Boolean, $sendWelcomeEmail: Boolean) {
  users {
    create(isStudent: $isStudent, providerKey: $providerKey, email: $email, name: $name, passwordRaw: $passwordRaw, groups: $groups, mustChangePassword: $mustChangePassword, sendWelcomeEmail: $sendWelcomeEmail) {
      responseResult {
        succeeded
        errorCode
        slug
        message
      }
    }
  }
}
