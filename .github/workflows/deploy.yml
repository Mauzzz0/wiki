name: Deploy
on:
  workflow_dispatch:

jobs:
  Deploy:
    name: Check
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - uses: actions/checkout@master
        name: Checkout

      - name: Install yarn
        run: npm i -g yarn

      - name: Install dependencies
        run: yarn

      - name: Patch dependencies
        run: yarn patch-package

      - name: Build project
        run: yarn build
