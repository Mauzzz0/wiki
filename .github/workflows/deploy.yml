name: Deploy and Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Deploy:
    name: Deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@master
        name: Checkout

      - name: Build docker image
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: docker build -f ./dev/build/Dockerfile -t mauzzz0/wiki-js:latest .

      - name: Login to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u mauzzz0 --password-stdin
