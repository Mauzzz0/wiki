name: Deploy and Test
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Deploy:
    name: Deploy
    runs-on: self-hosted
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - uses: actions/checkout@master
        name: Checkout

      - name: Build docker image
        run: docker build -f ./dev/build/Dockerfile -t mauzzz0/wiki-js:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push docker image
        run: docker push mauzzz0/wiki-js:latest

      - name: Update and restart containers
        run: |
          cd C:\wiki-compose
          docker pull mauzzz0/wiki-js:latest
          docker compose down wiki
          docker compose up wiki -d
